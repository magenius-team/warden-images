name: Docker Image Allure
on:
  schedule:
    - cron: "30 3 * * 0" # At 03:30 on Sunday
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - version
      - images/allure/**
      - .github/workflows/docker-image-allure.yml

permissions:
  contents: read
  packages: write

jobs:
  allure:
    name: Allure
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '2.44.0'
    steps:
      - uses: actions/checkout@v7

      - name: Login to Github Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ !env.ACT }}
      - uses: docker/setup-qemu-action@v4
        with:
          cache-image: true
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: images/allure
          platforms: linux/amd64,linux/arm64
          build-contexts: |
            allure-source=https://github.com/fescobar/allure-docker-service.git#790d13f5e5283bcb839d68fe238546991af480db
          build-args: |
            ALLURE_RELEASE=${{ matrix.version }}
            BUILD_VERSION=${{ matrix.version }}
            BUILD_REF=790d13f5e5283bcb839d68fe238546991af480db
          push: ${{ github.ref == 'refs/heads/main' && !env.ACT }}
          tags: ghcr.io/${{ github.repository_owner }}/allure:${{ matrix.version }}
